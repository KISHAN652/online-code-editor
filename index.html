<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Modern online code editor playground for HTML, CSS, and JavaScript with live preview">
    <meta name="keywords" content="code editor, playground, HTML, CSS, JavaScript, live preview">
    <meta name="author" content="CodePlayground">
    
    <title>CodePlayground - Online Code Editor</title>
    
    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Header / Toolbar -->
        <header class="toolbar" role="banner">
            <div class="toolbar-left">
                <h1 class="logo">
                    <span class="logo-icon">{ }</span>
                    <span class="logo-text">CodePlayground</span>
                </h1>
            </div>
            
            <div class="toolbar-right">
                <button class="btn btn-secondary" id="resetBtn" aria-label="Reset all editors" title="Reset All">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                        <path d="M21 3v5h-5"/>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
                        <path d="M3 21v-5h5"/>
                    </svg>
                    <span class="btn-text">Reset</span>
                </button>
                
                <button class="btn btn-secondary" id="saveBtn" aria-label="Save code to local storage" title="Save Code">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    <span class="btn-text">Save</span>
                </button>
                
                <button class="btn btn-primary" id="runBtn" aria-label="Run code" title="Run Code (Ctrl+Enter)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="5 3 19 12 5 21 5 3"/>
                    </svg>
                    <span class="btn-text">Run</span>
                </button>
                
                <button class="btn btn-icon theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle Theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <!-- Editors Container -->
            <div class="editors-container" id="editorsContainer">
                
                <!-- HTML Editor Panel -->
                <div class="editor-panel" data-language="html">
                    <div class="panel-header" tabindex="0" role="button" aria-expanded="true">
                        <div class="panel-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="16 18 22 12 16 6"/>
                                <polyline points="8 6 2 12 8 18"/>
                            </svg>
                            <span>HTML</span>
                        </div>
                        <button class="collapse-btn" aria-label="Toggle HTML editor">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                    </div>
                    <div class="panel-content">
                        <div class="editor-wrapper">
                            <div class="line-numbers" id="htmlLineNumbers" aria-hidden="true"></div>
                            <textarea 
                                class="code-editor" 
                                id="htmlEditor" 
                                spellcheck="false"
                                aria-label="HTML code editor"
                                placeholder="<!-- Write your HTML here -->"
                            ></textarea>
                        </div>
                    </div>
                </div>

                <!-- CSS Editor Panel -->
                <div class="editor-panel" data-language="css">
                    <div class="panel-header" tabindex="0" role="button" aria-expanded="true">
                        <div class="panel-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                                <path d="M2 17l10 5 10-5"/>
                                <path d="M2 12l10 5 10-5"/>
                            </svg>
                            <span>CSS</span>
                        </div>
                        <button class="collapse-btn" aria-label="Toggle CSS editor">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                    </div>
                    <div class="panel-content">
                        <div class="editor-wrapper">
                            <div class="line-numbers" id="cssLineNumbers" aria-hidden="true"></div>
                            <textarea 
                                class="code-editor" 
                                id="cssEditor" 
                                spellcheck="false"
                                aria-label="CSS code editor"
                                placeholder="/* Write your CSS here */"
                            ></textarea>
                        </div>
                    </div>
                </div>

                <!-- JavaScript Editor Panel -->
                <div class="editor-panel" data-language="js">
                    <div class="panel-header" tabindex="0" role="button" aria-expanded="true">
                        <div class="panel-title">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="4 17 10 11 4 5"/>
                                <line x1="12" y1="19" x2="20" y2="19"/>
                            </svg>
                            <span>JavaScript</span>
                        </div>
                        <button class="collapse-btn" aria-label="Toggle JavaScript editor">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                    </div>
                    <div class="panel-content">
                        <div class="editor-wrapper">
                            <div class="line-numbers" id="jsLineNumbers" aria-hidden="true"></div>
                            <textarea 
                                class="code-editor" 
                                id="jsEditor" 
                                spellcheck="false"
                                aria-label="JavaScript code editor"
                                placeholder="// Write your JavaScript here"
                            ></textarea>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Preview Container -->
            <div class="preview-container">
                <div class="preview-header">
                    <div class="preview-title">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <span>Live Preview</span>
                    </div>
                    <div class="preview-status" id="previewStatus">
                        <span class="status-dot"></span>
                        <span class="status-text">Ready</span>
                    </div>
                </div>
                <div class="preview-content">
                    <iframe 
                        id="preview" 
                        sandbox="allow-scripts allow-modals allow-forms allow-popups allow-same-origin"
                        title="Code preview"
                    ></iframe>
                </div>
            </div>

        </main>

        <!-- Toast Notification -->
        <div class="toast" id="toast" role="alert" aria-live="polite">
            <svg class="toast-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span class="toast-message"></span>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
